          - paragraph [ref=e1005]: Common Questions
          - heading "Frequently Asked Questions" [level=2] [ref=e1006]
          - paragraph [ref=e1007]: Get quick answers to common questions about our courses, admissions, and placements.
        - generic [ref=e1008]:
          - generic [ref=e1009]:
            - button "What courses does MAAC Jaipur offer?" [ref=e1010] [cursor=pointer]:
              - generic [ref=e1011]: What courses does MAAC Jaipur offer?
              - img [ref=e1012]
            - paragraph [ref=e1015]: MAAC Jaipur offers comprehensive courses in 3D Animation, Visual Effects (VFX), Game Design, Digital Filmmaking, Motion Graphics, and Digital Media & Design. We provide B.Voc degrees, diploma programs (18-24 months), and short-term skill enhancement courses. All programs are NSDC and MESC certified with 95% placement assistance.
          - generic [ref=e1016]:
            - button "What is the eligibility for animation courses at MAAC Jaipur?" [ref=e1017] [cursor=pointer]:
              - generic [ref=e1018]: What is the eligibility for animation courses at MAAC Jaipur?
              - img [ref=e1019]
            - paragraph [ref=e1022]: "Eligibility varies by program: (1) B.Voc in 3D Animation & VFX requires 10+2 completion with minimum 50% marks. (2) Diploma programs accept students aged 18+ with 10+2 or equivalent. (3) Short-term skill enhancement courses are open to anyone with basic computer knowledge. No prior artistic or technical background required for most programs."
          - generic [ref=e1023]:
            - button "What is the course fee for animation and VFX programs?" [ref=e1024] [cursor=pointer]:
              - generic [ref=e1025]: What is the course fee for animation and VFX programs?
              - img [ref=e1026]
            - paragraph [ref=e1029]: Course fees at MAAC Jaipur range from ₹50,000 to ₹2,50,000 depending on the program duration and specialization. B.Voc programs (3 years) cost approximately ₹1,80,000 per year. Diploma programs (18-24 months) range from ₹1,00,000 to ₹1,80,000. We offer EMI options, education loans, and merit-based scholarships. Contact us at +91-7300001589 for detailed fee structure.
          - generic [ref=e1030]:
            - button "Does MAAC Jaipur provide placement assistance?" [ref=e1031] [cursor=pointer]:
              - generic [ref=e1032]: Does MAAC Jaipur provide placement assistance?
              - img [ref=e1033]
            - paragraph [ref=e1036]: Yes, MAAC Jaipur has a dedicated placement cell with a 95% placement record. Our students are placed at top studios including DNEG, Prime Focus, Redchillies VFX, MPC, Technicolor, Ubisoft, EA Games, and Rockstar Games. Average starting packages range from 3-6 LPA, with top performers securing 8-12 LPA. We provide resume building, portfolio development, mock interviews, and direct studio connections.
          - generic [ref=e1037]:
            - button "Is B.Voc degree available at MAAC Jaipur?" [ref=e1038] [cursor=pointer]:
              - generic [ref=e1039]: Is B.Voc degree available at MAAC Jaipur?
              - img [ref=e1040]
            - paragraph [ref=e1043]: "Yes, MAAC Jaipur offers B.Voc (Bachelor of Vocation) in 3D Animation & VFX, a UGC-recognized 3-year undergraduate degree. The program combines practical industry training with academic learning. Students earn multiple certifications: Advanced Diploma after 2 years, Diploma after 1 year, and B.Voc degree upon completion. This allows students to enter the workforce at multiple exit points."
          - generic [ref=e1044]:
            - button "What software and tools will I learn at MAAC Jaipur?" [ref=e1045] [cursor=pointer]:
              - generic [ref=e1046]: What software and tools will I learn at MAAC Jaipur?
              - img [ref=e1047]
            - paragraph [ref=e1050]: "Students gain proficiency in industry-standard software including: Autodesk Maya, 3ds Max, ZBrush for 3D modeling; Adobe After Effects, Nuke, Fusion for VFX compositing; Unreal Engine, Unity for game development; DaVinci Resolve, Premiere Pro for video editing; Photoshop, Illustrator for digital art. Our curriculum is updated regularly to include emerging technologies like AI tools, real-time rendering, and VR/AR."
